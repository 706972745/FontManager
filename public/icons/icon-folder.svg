<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<defs>
  <filter id="torn" x="-15%" y="-15%" width="130%" height="130%">
    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="9" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="4.5" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="torn2" x="-15%" y="-15%" width="130%" height="130%">
    <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="2" seed="4" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="sh" x="-45%" y="-45%" width="190%" height="190%">
    <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.22"/>
  </filter>
  <filter id="shm" x="-45%" y="-45%" width="190%" height="190%">
    <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000000" flood-opacity="0.28"/>
  </filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="21" result="t"/>
    <feColorMatrix in="t" type="saturate" values="0"/>
  </filter>
  <pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
    <circle cx="3" cy="3" r="2" fill="#14140f"/>
  </pattern>
  <pattern id="dotsL" width="13" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
    <circle cx="3" cy="3" r="2" fill="#ffffff"/>
  </pattern>
</defs>

