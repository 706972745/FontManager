<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<defs>
  <filter id="torn" x="-15%" y="-15%" width="130%" height="130%">
    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="9" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="4.5" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="torn2" x="-15%" y="-15%" width="130%" height="130%">
    <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="2" seed="4" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="sh" x="-45%" y="-45%" width="190%" height="190%">
    <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.22"/>
  </filter>
  <filter id="shm" x="-45%" y="-45%" width="190%" height="190%">
    <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000000" flood-opacity="0.28"/>
  </filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="21" result="t"/>
    <feColorMatrix in="t" type="saturate" values="0"/>
  </filter>
  <pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
    <circle cx="3" cy="3" r="2" fill="#14140f"/>
  </pattern>
  <pattern id="dotsL" width="13" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
    <circle cx="3" cy="3" r="2" fill="#ffffff"/>
  </pattern>
</defs>

<g transform="translate(-14,8) rotate(-7,256,256)">
  <path d="M112,92 Q112,70 134,70 H338 L404,136 V420 Q404,442 382,442 H134 Q112,442 112,420 Z" fill="#b5b5ae" filter="url(#torn)" opacity="0.95"/>
</g>
<clipPath id="c4"><path d="M112,92 Q112,70 134,70 H338 L404,136 V420 Q404,442 382,442 H134 Q112,442 112,420 Z" transform="rotate(1,256,256)"/></clipPath>
<g transform="translate(0,0) rotate(1,256,256)" filter="url(#sh)" opacity="1"><path d="M112,92 Q112,70 134,70 H338 L404,136 V420 Q404,442 382,442 H134 Q112,442 112,420 Z" fill="#f8f8f5" filter="url(#torn)"/><path d="M338,70 L404,136 H338 Z" fill="#d9d9d4" filter="url(#torn2)"/><path d="M338,70 L404,136" stroke="#00000022" stroke-width="2" fill="none"/></g>
<g clip-path="url(#c4)">
  <g transform="translate(256,392) rotate(1)">
    <rect x="-138" y="-6" width="276" height="4" fill="#14140f" opacity="0.28"/>
    <line x1="-138" y1="26" x2="138" y2="26" stroke="#14140f" stroke-opacity="0.22"
          stroke-width="4" stroke-dasharray="22 14"/>
    <line x1="-138" y1="52" x2="138" y2="52" stroke="#14140f" stroke-opacity="0.22"
          stroke-width="4" stroke-dasharray="22 14"/>
  </g>
</g>
