[package]
name = "fontmanager"
version = "1.3.9"
description = "Cross-platform font manager: preview, tag, activate/deactivate, and install fonts"
authors = ["TheHolyOneZ", "IIEOzo"]
license = "GPL-3.0-only"
homepage = "https://zsync.eu/fontmanager/"
repository = "https://github.com/TheHolyOneZ/FontManager"
edition = "2021"

[lib]
name = "fontmanager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ttf-parser = "0.25"
# WOFF1 表是 zlib 流；已在依赖树里（zip/reqwest 传递引入），这里显式声明复用同一版本
flate2 = "1"
walkdir = "2"
dirs = "6"
trash = "5"
zip = { version = "2", default-features = false, features = ["deflate"] }
thiserror = "2"
notify = "7"
rodio = { version = "0.19", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
sysinfo = "0.38.4"
tokio = { version = "1.53.1", features = ["time", "rt", "net", "sync"] }
# 本地 API（1.3.0）：极小 HTTP 服务，只绑 127.0.0.1
axum = { version = "0.8", default-features = false, features = ["json", "query", "tokio", "http1"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_UI_Shell", "Win32_Storage_FileSystem"] }
