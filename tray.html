<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FontManager</title>
    <!--
      托盘自绘菜单（右键托盘图标弹出）：一个独立轻量页，与 splash.html 同一路数 ——
      不引 React、不引 @fontsource、不引任何 CSS 框架，样式全部内联在下面。
      窗口由 Rust 侧（lib.rs 的 build_tray_menu_window）建：透明无边框、置顶、
      不进任务栏、失焦即藏；尺寸与位置也在 Rust 侧按图标矩形算好。

      ⚠️ 这页**绝不**加载 index.html / 主 React 应用：那会把整个字体 store 再跑一遍，
      双份事件监听 + 双份扫描。同理，本页只 invoke 命令、监听 `tray://show` 一个事件，
      其余一切（窗口显示 / 定位 / 隐藏）都由 Rust 完成。

      ── 尺寸与 lib.rs 的常量一一对应（改哪边都要同步另一边）──
      窗口宽 = TRAY_MENU_W = 264；行高：普通行 36 / 分组标题 26 / 子选项 32 / 分隔线 9；
      上下 padding 合计 12（6px × 2）。窗口高度由 Rust 按行数算（tray_menu_height），
      这里 CSS 改了行高而那边没改，菜单就会被裁掉一截或底部留一块挡点击的透明死区。

      ── 主题 ── 窗口级 theme（panel_theme）决定 prefers-color-scheme，与 splash 同法；
      四段按「系统 → 用户强制」的顺序叠。颜色数值**照 tokens.css 抄**（深浅两套），
      独立页引不了令牌文件 —— 改 tokens.css 里这几条要同步这里。

      ── 菜单文案的维护位置 ── 本页文案（菜单项 / 检查更新各状态）**不进**
      src/locales 的 i18n key 体系（独立页不参与 i18n:check），九语表写在
      src/tray.ts 顶部的 L10N 常量里。改文案只改那一处；其中「插件中心 / 设置 /
      检查更新各状态」的译名**照抄** locales JSON 的对应 key（来源写在表旁边），
      别在两边各造一套译名。

      ── 离线预览 ── 带 `?preview=1&libs=N&lang=xx&theme=light|dark` 打开时，
      不 invoke、用 URL 参数模拟数据（见 src/tray.ts 的 preview 分支），供
      无头浏览器截图核对两种数据形态（多库 / 单库）与两套主题。
    -->
    <style>
      /* ── 深色（默认）：:root 上就是深色值，跟 tokens.css 的 :root 段逐条对应 ── */
      :root {
        color-scheme: dark;
        --ink-rgb: 255, 255, 255;
        --scrim-rgb: 14, 14, 14;
        --text-primary: #e8e8e8;
        --text-secondary: rgba(232, 232, 232, 0.6);
        --text-tertiary: rgba(232, 232, 232, 0.4);
        --e2: rgba(255, 255, 255, 0.07);
        --e3: rgba(255, 255, 255, 0.1);
        --glass-border: rgba(255, 255, 255, 0.08);
        --glass-top-highlight-strong: rgba(255, 255, 255, 0.16);
        --accent-a: #d4d4d8;
        --shadow-ambient: 0 24px 48px rgba(0, 0, 0, 0.25);
        --shadow-mass: 0 6px 12px rgba(0, 0, 0, 0.3);
      }

      /* ── 跟系统：与 src/lib/theme.ts 的 `system` 同一条判据（prefers-color-scheme） ── */
      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
          --ink-rgb: 22, 22, 32;
          --scrim-rgb: 40, 40, 40;
          --text-primary: #1c1c24;
          --text-secondary: rgba(28, 28, 38, 0.62);
          --text-tertiary: rgba(28, 28, 38, 0.44);
          --e2: rgba(22, 22, 32, 0.07);
          --e3: rgba(253, 253, 255, 0.66);
          --glass-border: rgba(0, 0, 0, 0.1);
          --glass-top-highlight-strong: rgba(255, 255, 255, 0.9);
          --accent-a: #3f3f46;
          --shadow-ambient: 0 24px 48px rgba(30, 30, 55, 0.08);
          --shadow-mass: 0 6px 12px rgba(30, 30, 55, 0.08);
        }
      }

      /* ── 用户强制：属性选择器必须排在 @media 之后，「用户选的」永远压过「系统的」 ── */
      :root[data-theme="dark"] {
        color-scheme: dark;
        --ink-rgb: 255, 255, 255;
        --scrim-rgb: 14, 14, 14;
        --text-primary: #e8e8e8;
        --text-secondary: rgba(232, 232, 232, 0.6);
        --text-tertiary: rgba(232, 232, 232, 0.4);
        --e2: rgba(255, 255, 255, 0.07);
        --e3: rgba(255, 255, 255, 0.1);
        --glass-border: rgba(255, 255, 255, 0.08);
        --glass-top-highlight-strong: rgba(255, 255, 255, 0.16);
        --accent-a: #d4d4d8;
        --shadow-ambient: 0 24px 48px rgba(0, 0, 0, 0.25);
        --shadow-mass: 0 6px 12px rgba(0, 0, 0, 0.3);
      }

      :root[data-theme="light"] {
        color-scheme: light;
        --ink-rgb: 22, 22, 32;
        --scrim-rgb: 40, 40, 40;
        --text-primary: #1c1c24;
        --text-secondary: rgba(28, 28, 38, 0.62);
        --text-tertiary: rgba(28, 28, 38, 0.44);
        --e2: rgba(22, 22, 32, 0.07);
        --e3: rgba(253, 253, 255, 0.66);
        --glass-border: rgba(0, 0, 0, 0.1);
        --glass-top-highlight-strong: rgba(255, 255, 255, 0.9);
        --accent-a: #3f3f46;
        --shadow-ambient: 0 24px 48px rgba(30, 30, 55, 0.08);
        --shadow-mass: 0 6px 12px rgba(30, 30, 55, 0.08);
      }

      /* 动效令牌：照 tokens.css 抄（--t-micro 100ms / --t-quick 180ms /
         --ease-out cubic-bezier(0.16,1,0.3,1)），改这边要同步那边；
         「减弱动效」双轨：下面 @media 系统通道 + tray.ts 侧不重放入场动画。 */
      :root {
        --t-micro: 100ms;
        --t-quick: 180ms;
        --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        /* 窗口本身是 transparent:true：背景必须留空，圆角才不会被黑底吃掉 */
        background: transparent;
        overflow: hidden;
        cursor: default;
        color: var(--text-primary);
        /* 照 tokens.css 的 --font-ui 抄（独立页引不了） */
        font-family: "Inter Variable", "Inter", system-ui, "Segoe UI", "Microsoft YaHei",
          "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Noto Sans SC",
          "Source Han Sans SC", "WenQuanYi Micro Hei", sans-serif;
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }

      * {
        box-sizing: border-box;
      }

      /* 菜单表面：数值照 app.css 的 .ctx-menu + .glass-e3 抄 —— 背景 = scrim 压一层
         --e3、圆角 6（app.css 实际值，规格书 R7 的「菜单 8」没落地，以代码为准）、
         内衬高光 + 落影。R0：不新增任何落盘，纯显示层。 */
      .trm {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        padding: 6px 0;
        border-radius: 6px;
        overflow: hidden;
        background:
          linear-gradient(rgba(var(--scrim-rgb), 0.3), rgba(var(--scrim-rgb), 0.3)),
          var(--e3);
        backdrop-filter: blur(24px) saturate(140%) brightness(1.05);
        -webkit-backdrop-filter: blur(24px) saturate(140%) brightness(1.05);
        border: 1px solid var(--glass-border);
        box-shadow:
          inset 0 1px 0 var(--glass-top-highlight-strong),
          var(--shadow-mass),
          var(--shadow-ambient);
      }

      /* 弹层入场（§12.4）：--t-quick(180ms) + --ease-out，从下方 8px 浮起淡入；
         窗口是复用的，动画由 tray.ts 在每次 tray://show 时重放。
         退出即时 hide，不做退场动画。 */
      .trm.in {
        animation: trm-in var(--t-quick) var(--ease-out);
      }

      @keyframes trm-in {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
      }

      /* 系统开了「减少动态效果」：入场动画整个不做（铁律 §12.1 第 2 条） */
      @media (prefers-reduced-motion: reduce) {
        .trm.in {
          animation: none;
        }
        :root {
          --t-micro: 1ms;
          --t-quick: 1ms;
        }
      }

      /* 普通菜单行。padding/字号/圆角照 .ctx-item（7px 10px / 13px / 4px）；
         行高锁 36 —— lib.rs 的 tray_menu_height 按它算窗口高度，别改成 auto。 */
      .trm-item {
        display: flex;
        align-items: center;
        gap: 9px;
        width: 100%;
        height: 36px;
        flex: none;
        padding: 0 10px;
        border: none;
        border-radius: 4px;
        background: transparent;
        font: inherit;
        font-size: 13px;
        color: var(--text-secondary);
        text-align: left;
        cursor: pointer;
        /* hover 底色过渡走 --t-micro（§12：颜色/透明度反馈这一档） */
        transition: background var(--t-micro) ease, color var(--t-micro) ease;
      }

      .trm-item:hover {
        background: var(--e2);
        color: var(--text-primary);
      }

      .trm-item .trm-ico {
        display: grid;
        place-items: center;
        width: 16px;
        flex: none;
        color: var(--text-tertiary);
        transition: color var(--t-micro) ease;
      }

      .trm-item:hover .trm-ico {
        color: var(--text-primary);
      }

      .trm-label {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .trm-item:disabled {
        cursor: default;
        opacity: 0.4;
      }

      .trm-item:disabled:hover {
        background: transparent;
        color: var(--text-secondary);
      }

      /* 选中项（当前库 / 当前语言）：底色 + 左侧 2px 竖线 + 文字色
         （§12.4 行选中五件事里菜单行的三件）。竖线用强调色 --accent-a。 */
      .trm-item.sel {
        background: var(--e2);
        color: var(--text-primary);
      }

      .trm-item.sel::before {
        content: "";
        position: absolute;
        left: 3px;
        width: 2px;
        height: 14px;
        border-radius: 1px;
        background: var(--accent-a);
      }

      .trm-item.sel {
        position: relative;
      }

      /* 分组标题（「切换字体库」/「切换语言」）：小字弱色，不可点。
         行高锁 26 —— 同上，参与窗口高度计算。 */
      .trm-group {
        display: flex;
        align-items: flex-end;
        width: 100%;
        height: 26px;
        flex: none;
        padding: 0 10px 5px;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: var(--text-tertiary);
        pointer-events: none;
      }

      /* 子选项行（库目录 / 语言名）：比普通行矮一档，缩进对齐普通行的文字起点。
         行高锁 32。 */
      .trm-opt {
        display: flex;
        align-items: center;
        gap: 9px;
        width: 100%;
        height: 32px;
        flex: none;
        padding: 0 10px 0 35px;
        border: none;
        border-radius: 4px;
        background: transparent;
        font: inherit;
        font-size: 12.5px;
        color: var(--text-secondary);
        text-align: left;
        cursor: pointer;
        transition: background var(--t-micro) ease, color var(--t-micro) ease;
      }

      .trm-opt:hover {
        background: var(--e2);
        color: var(--text-primary);
      }

      .trm-opt.sel {
        position: relative;
        background: var(--e2);
        color: var(--text-primary);
      }

      .trm-opt.sel::before {
        content: "";
        position: absolute;
        left: 24px;
        width: 2px;
        height: 14px;
        border-radius: 1px;
        background: var(--accent-a);
      }

      .trm-name {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .trm-dir {
        flex: none;
        max-width: 96px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 10.5px;
        color: var(--text-tertiary);
      }

      /* 分隔线：总高 9 = 1px 线 + 上下 4px（照 .ctx-sep） */
      .trm-sep {
        width: 100%;
        height: 1px;
        flex: none;
        margin: 4px 0;
        background: rgba(var(--ink-rgb), 0.07);
      }

      /* 检查更新的结果态：结果直接写在这一项的标签上（不弹设置页），
         检查中 / 失败用弱色，发现新版用强调色 */
      .trm-item.trm-update-state .trm-label {
        font-size: 12.5px;
      }

      .trm-item.trm-update-busy,
      .trm-item.trm-update-failed {
        color: var(--text-tertiary);
      }

      .trm-item.trm-update-found {
        color: var(--text-primary);
      }
    </style>
  </head>

  <body>
    <!-- 结构由 src/tray.ts 渲染。这里留空壳：文案要等数据回来才知道语言。 -->
    <div class="trm" id="trm"></div>
    <script type="module" src="/src/tray.ts"></script>
  </body>
</html>
