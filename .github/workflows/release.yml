# 发版流水线：构建 → 发布（Windows 单平台）
#
# 触发：推送 v* tag（或手动指定 tag 重跑）
#
# 职责划分：
#   ci.yml       → push / PR 时验证代码（类型检查 + 单测 + 编译检查）
#   release.yml  → 推 v* tag 时构建两个安装包并发布到 GitHub Release（本文件）
#
# 说明：签名方案为 SignPath Foundation 免费 OV（见 CODE_SIGNING_POLICY.md），
#       **当前尚未启用** —— 仓库没有配置签名 Secrets，所有已发布版本均为未签名。
# release.yml 在「收集安装包」后插入签名步骤；未配置 SIGNPATH_TOKEN 时自动跳过，
# 正文随之退回「未签名 + SHA-256」说明；配齐 Secrets 后自动切换为签名发布。

name: Release (Windows)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（形如 v1.1.2）"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  COREPACK_ENABLE_AUTO_PIN: "0"
  COREPACK_ENABLE_STRICT: "0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    name: Build → Publish
    runs-on: windows-2025

    # secrets 上下文在 steps[*].if 里不可用（GitHub 会判定整个工作流无效，
    # 表现为每次 push 都出现一条 0 job 的 failure）。这里先落到 job 级 env，
    # 步骤条件改用 env.SIGNPATH_TOKEN 判断。
    env:
      SIGNPATH_TOKEN: ${{ secrets.SIGNPATH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Add x86_64-pc-windows-msvc target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: src-tauri
          key: windows-x64-release

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: 版本号与 tag 一致性校验
        shell: pwsh
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          $tag = if ($env:TAG_INPUT) { $env:TAG_INPUT } else { "${{ github.ref_name }}" }
          if ($tag -notmatch '^v\d+\.\d+\.\d+') { throw "tag 不是 vX.Y.Z 形式：$tag" }
          $want = $tag.Substring(1)

          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $pkg  = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $toml = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          # Cargo.lock 是跨行结构，Select-String 按行匹配会漏，必须整块读再正则
          $lockRaw = Get-Content src-tauri/Cargo.lock -Raw
          $lock = [regex]::Match($lockRaw, 'name = "fontmanager"\r?\nversion = "([^"]+)"').Groups[1].Value

          Write-Host "tag=$tag"
          Write-Host "tauri.conf.json=$conf  package.json=$pkg  Cargo.toml=$toml  Cargo.lock=$lock"
          foreach ($pair in @(@('tauri.conf.json',$conf), @('package.json',$pkg), @('Cargo.toml',$toml), @('Cargo.lock',$lock))) {
            if ($pair[1] -ne $want) { throw "版本号不一致：$($pair[0]) 是 $($pair[1])，tag 要求 $want" }
          }
          if (-not (Select-String -Path CHANGELOG.md -Pattern "^##\s+\[$([regex]::Escape($want))\]" -Quiet)) {
            throw "CHANGELOG.md 缺少 [$want] 段落"
          }
          Write-Host "版本号六处一致，CHANGELOG 有对应段落 ✅"

      # NSIS / WiX 打包工具链由 tauri 首次打包时从 GitHub CDN 现下（NSIS 2.3 MB、
      # WiX 10 MB），偶发 502/504。**不要缓存它**：一次 504 会在缓存目录留下半残包，
      # 之后恢复缓存就永远跳过下载、打包一直失败（2026-11-08 踩过）。
      # 只加重试：最多三次，每次都是干净的重下。
      - name: Build — NSIS + MSI
        shell: pwsh
        run: |
          $ok = $false
          "CI-BUILD-LOG" | Out-File build-log.txt -Encoding utf8
          for ($i = 1; $i -le 3; $i++) {
            Write-Host "== 打包尝试 $i / 3 =="
            "===== ATTEMPT $i =====" | Out-File -Append build-log.txt -Encoding utf8
            pnpm tauri build --bundles nsis,msi --target x86_64-pc-windows-msvc 2>&1 |
              Tee-Object -FilePath attempt.txt
            $code = $LASTEXITCODE
            "EXIT=$code" | Out-File -Append build-log.txt -Encoding utf8
            Get-Content attempt.txt | Out-File -Append build-log.txt -Encoding utf8
            if ($code -eq 0) { $ok = $true; break }
            Write-Host "第 $i 次打包失败（多半是 NSIS/WiX 工具链下载 502/504），20 秒后重试"
            Start-Sleep -Seconds 20
          }
          if (-not $ok) {
            # 失败时把完整日志推到 ci-release-log 分支（匿名可读），便于诊断
            git config user.name "ci-log"
            git config user.email "ci-log@users.noreply.github.com"
            git checkout -B ci-release-log
            git add build-log.txt
            git commit -m "release build log [skip ci]" --no-verify
            git push origin ci-release-log --force
            throw "打包三次都失败 —— 完整日志已推到 ci-release-log 分支"
          }

      # ⚠️ 这一段**不能**用 `Get-ChildItem ... | Select-Object -First 1` 取安装包。
      # 原因（2026-11-14 实测）：Get-ChildItem 按**文件名**枚举，`FontManager_2.1.1_...`
      # 排在 `FontManager_2.1.6_...` 前面，`-First 1` 拿到的就是**最旧**那个；本机
      # `bundle\nsis\` 里当时躺着 2.1.1–2.1.6 共 6 个包，直接能复现。CI 干净 runner 上
      # 碰巧只有一个才没出事，一旦缓存了 target（或换自托管 runner）就会把旧包当成品发出去。
      # 所以这里改成：**按版本号降序取最高 + 与 tauri.conf.json 的 version 严格对账 +
      # 同版本恰好 1 份**，任何一条不满足就 throw（宁可 CI 红，也不要发错包）。
      #
      # 命名约定（PRD D6）：只有主推包以 `-setup.exe` 结尾；NSIS 回退件叫
      # `...-x64-nsis-fallback.exe`，`update.rs::pick_setup()` 只认 `ends_with("-setup.exe")`，
      # 所以回退件在结构上不可能被一键更新选中 —— 这里也必须把它排除在选择范围外。
      - name: 收集安装包
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null

          # 期望版本以 tauri.conf.json 为准：它是 bundle 版本的真源（package.json 只管前端）。
          $expected = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($expected -notmatch '^\d+\.\d+\.\d+$') {
            throw "tauri.conf.json 的 version 不是 x.y.z 形式：'$expected'"
          }
          Write-Host "期望版本（tauri.conf.json）：$expected"

          # 唯一判定入口：正则只接受 `FontManager_<x.y.z>_x64-setup.exe`。
          # 这个正则本身就把 -nsis-fallback.exe 挡在外面了；下面再显式排一次，
          # 是为了防止将来有人放宽正则、却忘了这条命名约定。
          $pattern = '^FontManager_(\d+\.\d+\.\d+)_x64-setup\.exe$'
          $candidates = @(
            Get-ChildItem -Recurse -File -Path src-tauri/target -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match 'bundle[\\/]nsis' } |
              Where-Object { $_.Name -notlike '*-nsis-fallback.exe' } |
              ForEach-Object {
                $m = [regex]::Match($_.Name, $pattern, 'IgnoreCase')
                if ($m.Success) {
                  [pscustomobject]@{ File = $_; Version = [version]$m.Groups[1].Value }
                }
              }
          )

          if ($candidates.Count -eq 0) {
            throw "没找到 NSIS 安装包（期望 FontManager_${expected}_x64-setup.exe）"
          }

          # 按**版本号**降序取最高，不看文件名顺序。
          $newest = $candidates | Sort-Object -Property Version -Descending | Select-Object -First 1
          Write-Host ("候选 {0} 份，最高版本 {1}" -f $candidates.Count, $newest.Version)

          # 对账①：最高版本必须等于 tauri.conf.json。偏低=目录里残留旧包；
          # 偏高=工作区被别的版本污染（说明构建用的不是这份源码）。两种都拒发。
          if ($newest.Version -ne [version]$expected) {
            throw ("目录里最高的 NSIS 包是 {0}，但 tauri.conf.json 是 {1} —— 拒绝发布" -f $newest.Version, $expected)
          }

          # 对账②：同版本必须恰好 1 份。两份同版本 = 来源说不清，同样拒发。
          $same = @($candidates | Where-Object { $_.Version -eq [version]$expected })
          if ($same.Count -ne 1) {
            $names = ($same | ForEach-Object { $_.File.FullName }) -join "`n    "
            throw ("同版本 {0} 的 NSIS 安装包有 {1} 份，必须恰好 1 份：`n    {2}" -f $expected, $same.Count, $names)
          }

          # MSI 走**同一套**判定（2.1.7 收口 R-2）：`Select-Object -First 1` 与 exe 那边
          # 是同一个缺陷 —— Get-ChildItem 按文件名枚举，`FontManager_2.1.1_...msi` 排在
          # `2.1.6` 前面，多份并存时会挑到最旧的。MSI 不参与一键更新，只影响手动下载安装的人，
          # 但"发出去的安装包是哪个版本"没有理由允许不确定。
          # 语言后缀（_en-US）用 [A-Za-z-]+ 兜住，不写死，避免将来换 WiX 语言就全不匹配。
          $msiPattern = '^FontManager_(\d+\.\d+\.\d+)_x64_[A-Za-z-]+\.msi$'
          $msiCandidates = @(
            Get-ChildItem -Recurse -File -Path src-tauri/target -Filter "*.msi" -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match 'bundle[\\/]msi' } |
              ForEach-Object {
                $m = [regex]::Match($_.Name, $msiPattern, 'IgnoreCase')
                if ($m.Success) {
                  [pscustomobject]@{ File = $_; Version = [version]$m.Groups[1].Value }
                }
              }
          )
          if ($msiCandidates.Count -eq 0) {
            throw "没找到 MSI 安装包（期望 FontManager_${expected}_x64_<lang>.msi）"
          }

          $newestMsi = $msiCandidates | Sort-Object -Property Version -Descending | Select-Object -First 1
          if ($newestMsi.Version -ne [version]$expected) {
            throw ("目录里最高的 MSI 是 {0}，但 tauri.conf.json 是 {1} —— 拒绝发布" -f $newestMsi.Version, $expected)
          }
          $msiSame = @($msiCandidates | Where-Object { $_.Version -eq [version]$expected })
          if ($msiSame.Count -ne 1) {
            $names = ($msiSame | ForEach-Object { $_.File.FullName }) -join "`n    "
            throw ("同版本 {0} 的 MSI 有 {1} 份，必须恰好 1 份：`n    {2}" -f $expected, $msiSame.Count, $names)
          }

          Copy-Item $same[0].File.FullName release/
          Copy-Item $msiSame[0].File.FullName release/

          # 出厂闸：release/ 里以 -setup.exe 结尾的文件必须恰好 1 个（PRD F8）。
          # 多一个就说明上面哪条判定漏了，这里兜底。
          $published = @(Get-ChildItem release -File | Where-Object { $_.Name -like '*-setup.exe' })
          if ($published.Count -ne 1) {
            throw ("release/ 里以 -setup.exe 结尾的文件有 {0} 个，必须恰好 1 个" -f $published.Count)
          }
          if ($published[0].Name -ne "FontManager_${expected}_x64-setup.exe") {
            throw ("发布物文件名 '{0}' 与期望 FontManager_${expected}_x64-setup.exe 不一致" -f $published[0].Name)
          }

          # 同名闸（MSI）：与 exe 对称 —— release/ 里必须恰好 1 个 msi，且版本是期望值。
          $publishedMsi = @(Get-ChildItem release -File -Filter '*.msi')
          if ($publishedMsi.Count -ne 1) {
            throw ("release/ 里的 msi 有 {0} 个，必须恰好 1 个" -f $publishedMsi.Count)
          }
          if ($publishedMsi[0].Name -notlike "FontManager_${expected}_x64_*.msi") {
            throw ("发布物 MSI 文件名 '{0}' 与期望 FontManager_${expected}_x64_<lang>.msi 不一致" -f $publishedMsi[0].Name)
          }

          Get-ChildItem release | Format-Table Name, Length

      # 运行时不在安装包里（1.4.11 起按需下载），但「设置 → 插件 → 运行时管理」
      # 的补全下载用的是 releases/latest/download/{python,node}-runtime.zip 这条
      # **最新版链接** —— 每个 release 都必须带上一份，链接才不会断。从仓库资源直接打包。
      - name: 打包运行时（供运行时管理下载补全）
        shell: pwsh
        run: |
          if (Test-Path src-tauri/resources/python-runtime) {
            Compress-Archive -Path src-tauri/resources/python-runtime -DestinationPath release/python-runtime.zip -Force
          }
          if (Test-Path src-tauri/resources/node-runtime) {
            Compress-Archive -Path src-tauri/resources/node-runtime -DestinationPath release/node-runtime.zip -Force
          }
          $zips = Get-ChildItem release/*-runtime.zip -ErrorAction SilentlyContinue
          if (-not $zips) { Write-Host '（仓库里没有运行时资源 —— 跳过，运行时管理会提示手动下载）' }
          else { $zips | Format-Table Name, Length }

      # ── 代码签名（SignPath Foundation，免费 OV）──────────────────────
      # 未配置 SIGNPATH_TOKEN 时本步骤自动跳过，发布仍为「未签名 + SHA-256」，
      # 与现有行为完全一致；在 GitHub Secrets 配齐后自动切换为签名发布。
      # 申请入口：https://signpath.org  →  Apply for Free Code Signing
      - name: 代码签名（SignPath Foundation）
        if: env.SIGNPATH_TOKEN != ''
        shell: pwsh
        env:
          SIGNPATH_ORG: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_POLICY: ${{ secrets.SIGNPATH_SIGNING_POLICY }}
        run: |
          Install-Module -Name SignPath -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module SignPath
          $files = Get-ChildItem -Path release -Include *.exe,*.msi
          if ($files.Count -eq 0) { throw "release 里没有可签名的 exe/msi" }
          foreach ($f in $files) {
            Write-Host "签名：$($f.Name)"
            Submit-SigningRequest -OrganizationId $env:SIGNPATH_ORG `
              -ProjectSlug $env:SIGNPATH_PROJECT `
              -SigningPolicyName $env:SIGNPATH_POLICY `
              -ArtifactPath $f.FullName `
              -OutputArtifactPath $f.FullName `
              -CIUserToken $env:SIGNPATH_TOKEN `
              -WaitForCompletion
            Write-Host "  ✅ $($f.Name) 已签名"
          }

      - name: 留存产物（万一发布失败可手动下载）
        uses: actions/upload-artifact@v4
        with:
          name: zfm-windows
          path: release/*
          retention-days: 7

      - name: 生成 Release 正文
        shell: pwsh
        env:
          TAG_INPUT: ${{ inputs.tag }}
          SIGNED: ${{ env.SIGNPATH_TOKEN != '' }}
        run: |
          $tag = if ($env:TAG_INPUT) { $env:TAG_INPUT } else { "${{ github.ref_name }}" }
          $ver = $tag.Substring(1)
          # 必须用哈希表 splat：数组 splat 不绑定命名参数，
          # 会报 "A positional parameter cannot be found that accepts argument '-OutFile'"
          # （1.4.1 的 tag 构建就死在这一步，本地 5.1 与 runner 上的 7.x 都一样）。
          $noteArgs = @{
            Version    = $ver
            ReleaseDir = 'release'
            OutFile    = 'release-notes.md'
          }
          if ($env:SIGNED -eq 'true') { $noteArgs.Signed = $true }
          & .\.github\scripts\make-release-notes.ps1 @noteArgs
          Write-Host "---------- 正文预览 ----------"
          Get-Content release-notes.md -Encoding UTF8 | Select-Object -First 20

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: FontManager ${{ inputs.tag || github.ref_name }}
          body_path: release-notes.md
          files: release/*
          draft: false
          prerelease: false
          fail_on_unmatched_files: true

      # 这一步是补丁，不是多余动作：
      # action-gh-release 在「release 已经存在」时只替换 asset，**不会**把 body/name 覆盖上去
      # （日志里的 'Using release … instead of duplicate draft …' 就是这个分支）。
      # 结果是：手工建过 release 的版本，正文里的 SHA-256 会和实际安装包对不上 —— 1.4.1 就踩了。
      # 所以发布后无条件对齐一次正文；失败只告警（安装包已经发出去了，不该因此判整个发版失败）。
      - name: 正文与安装包对齐
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          $tag = if ($env:TAG_INPUT) { $env:TAG_INPUT } else { "${{ github.ref_name }}" }
          $repo = "${{ github.repository }}"
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
          try {
            $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/tags/$tag" -Headers $headers
            $payload = @{ name = "FontManager $tag"; body = (Get-Content release-notes.md -Raw -Encoding UTF8) } | ConvertTo-Json -Compress
            Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/$($rel.id)" -Headers $headers `
              -Method Patch -ContentType "application/json; charset=utf-8" `
              -Body ([System.Text.Encoding]::UTF8.GetBytes($payload)) | Out-Null
            Write-Host "正文已对齐（release $($rel.id)，$($payload.Length) 字节）"
          } catch {
            Write-Warning "正文对齐失败：$($_.Exception.Message)——安装包已发布，正文可能仍是旧的"
          }
