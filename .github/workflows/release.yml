# 发版流水线：构建 → 发布（Windows 单平台）
#
# 触发：推送 v* tag（或手动指定 tag 重跑）
#
# 职责划分：
#   ci.yml       → push / PR 时验证代码（类型检查 + 单测 + 编译检查）
#   release.yml  → 推 v* tag 时构建两个安装包并发布到 GitHub Release（本文件）
#
# 说明：项目通过 SignPath Foundation 免费 OV 签名（见 CODE_SIGNING_POLICY.md）。
# release.yml 在「收集安装包」后插入签名步骤；未配置 SIGNPATH_TOKEN 时自动跳过，
# 正文随之退回「未签名 + SHA-256」说明，与历史行为一致。

name: Release (Windows)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（形如 v1.1.2）"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  COREPACK_ENABLE_AUTO_PIN: "0"
  COREPACK_ENABLE_STRICT: "0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    name: Build → Publish
    runs-on: windows-2025

    # secrets 上下文在 steps[*].if 里不可用（GitHub 会判定整个工作流无效，
    # 表现为每次 push 都出现一条 0 job 的 failure）。这里先落到 job 级 env，
    # 步骤条件改用 env.SIGNPATH_TOKEN 判断。
    env:
      SIGNPATH_TOKEN: ${{ secrets.SIGNPATH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Add x86_64-pc-windows-msvc target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: src-tauri
          key: windows-x64-release

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: 版本号与 tag 一致性校验
        shell: pwsh
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          $tag = if ($env:TAG_INPUT) { $env:TAG_INPUT } else { "${{ github.ref_name }}" }
          if ($tag -notmatch '^v\d+\.\d+\.\d+') { throw "tag 不是 vX.Y.Z 形式：$tag" }
          $want = $tag.Substring(1)

          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $pkg  = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $toml = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          # Cargo.lock 是跨行结构，Select-String 按行匹配会漏，必须整块读再正则
          $lockRaw = Get-Content src-tauri/Cargo.lock -Raw
          $lock = [regex]::Match($lockRaw, 'name = "fontmanager"\r?\nversion = "([^"]+)"').Groups[1].Value

          Write-Host "tag=$tag"
          Write-Host "tauri.conf.json=$conf  package.json=$pkg  Cargo.toml=$toml  Cargo.lock=$lock"
          foreach ($pair in @(@('tauri.conf.json',$conf), @('package.json',$pkg), @('Cargo.toml',$toml), @('Cargo.lock',$lock))) {
            if ($pair[1] -ne $want) { throw "版本号不一致：$($pair[0]) 是 $($pair[1])，tag 要求 $want" }
          }
          if (-not (Select-String -Path CHANGELOG.md -Pattern "^##\s+\[$([regex]::Escape($want))\]" -Quiet)) {
            throw "CHANGELOG.md 缺少 [$want] 段落"
          }
          Write-Host "版本号六处一致，CHANGELOG 有对应段落 ✅"

      - name: Build — NSIS + MSI
        run: pnpm tauri build --bundles nsis,msi --target x86_64-pc-windows-msvc

      - name: 收集安装包
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          $exe = Get-ChildItem -Recurse -Path src-tauri/target -Filter "*-setup.exe" |
                 Where-Object { $_.FullName -match 'bundle[\\/]nsis' } | Select-Object -First 1
          $msi = Get-ChildItem -Recurse -Path src-tauri/target -Filter "*.msi" |
                 Where-Object { $_.FullName -match 'bundle[\\/]msi' } | Select-Object -First 1
          if (-not $exe) { throw "没找到 NSIS 安装包" }
          if (-not $msi) { throw "没找到 MSI 安装包" }
          Copy-Item $exe.FullName release/
          Copy-Item $msi.FullName release/
          Get-ChildItem release | Format-Table Name, Length

      # ── 代码签名（SignPath Foundation，免费 OV）──────────────────────
      # 未配置 SIGNPATH_TOKEN 时本步骤自动跳过，发布仍为「未签名 + SHA-256」，
      # 与现有行为完全一致；在 GitHub Secrets 配齐后自动切换为签名发布。
      # 申请入口：https://signpath.org  →  Apply for Free Code Signing
      - name: 代码签名（SignPath Foundation）
        if: env.SIGNPATH_TOKEN != ''
        shell: pwsh
        env:
          SIGNPATH_ORG: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_POLICY: ${{ secrets.SIGNPATH_SIGNING_POLICY }}
        run: |
          Install-Module -Name SignPath -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module SignPath
          $files = Get-ChildItem -Path release -Include *.exe,*.msi
          if ($files.Count -eq 0) { throw "release 里没有可签名的 exe/msi" }
          foreach ($f in $files) {
            Write-Host "签名：$($f.Name)"
            Submit-SigningRequest -OrganizationId $env:SIGNPATH_ORG `
              -ProjectSlug $env:SIGNPATH_PROJECT `
              -SigningPolicyName $env:SIGNPATH_POLICY `
              -ArtifactPath $f.FullName `
              -OutputArtifactPath $f.FullName `
              -CIUserToken $env:SIGNPATH_TOKEN `
              -WaitForCompletion
            Write-Host "  ✅ $($f.Name) 已签名"
          }

      - name: 留存产物（万一发布失败可手动下载）
        uses: actions/upload-artifact@v4
        with:
          name: zfm-windows
          path: release/*
          retention-days: 7

      - name: 生成 Release 正文
        shell: pwsh
        env:
          TAG_INPUT: ${{ inputs.tag }}
          SIGNED: ${{ env.SIGNPATH_TOKEN != '' }}
        run: |
          $tag = if ($env:TAG_INPUT) { $env:TAG_INPUT } else { "${{ github.ref_name }}" }
          $ver = $tag.Substring(1)
          # 必须用哈希表 splat：数组 splat 不绑定命名参数，
          # 会报 "A positional parameter cannot be found that accepts argument '-OutFile'"
          # （1.4.1 的 tag 构建就死在这一步，本地 5.1 与 runner 上的 7.x 都一样）。
          $noteArgs = @{
            Version    = $ver
            ReleaseDir = 'release'
            OutFile    = 'release-notes.md'
          }
          if ($env:SIGNED -eq 'true') { $noteArgs.Signed = $true }
          & .\.github\scripts\make-release-notes.ps1 @noteArgs
          Write-Host "---------- 正文预览 ----------"
          Get-Content release-notes.md -Encoding UTF8 | Select-Object -First 20

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: FontManager ${{ inputs.tag || github.ref_name }}
          body_path: release-notes.md
          files: release/*
          draft: false
          prerelease: false
          fail_on_unmatched_files: true

      # 这一步是补丁，不是多余动作：
      # action-gh-release 在「release 已经存在」时只替换 asset，**不会**把 body/name 覆盖上去
      # （日志里的 'Using release … instead of duplicate draft …' 就是这个分支）。
      # 结果是：手工建过 release 的版本，正文里的 SHA-256 会和实际安装包对不上 —— 1.4.1 就踩了。
      # 所以发布后无条件对齐一次正文；失败只告警（安装包已经发出去了，不该因此判整个发版失败）。
      - name: 正文与安装包对齐
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          $tag = if ($env:TAG_INPUT) { $env:TAG_INPUT } else { "${{ github.ref_name }}" }
          $repo = "${{ github.repository }}"
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
          try {
            $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/tags/$tag" -Headers $headers
            $payload = @{ name = "FontManager $tag"; body = (Get-Content release-notes.md -Raw -Encoding UTF8) } | ConvertTo-Json -Compress
            Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/$($rel.id)" -Headers $headers `
              -Method Patch -ContentType "application/json; charset=utf-8" `
              -Body ([System.Text.Encoding]::UTF8.GetBytes($payload)) | Out-Null
            Write-Host "正文已对齐（release $($rel.id)，$($payload.Length) 字节）"
          } catch {
            Write-Warning "正文对齐失败：$($_.Exception.Message)——安装包已发布，正文可能仍是旧的"
          }
