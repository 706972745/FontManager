# 发版流水线：构建 → 发布（Windows 单平台）
#
# 触发：推送 v* tag（或手动指定 tag 重跑）
#
# 职责划分：
#   ci.yml       → push / PR 时验证代码（类型检查 + 单测 + 编译检查）
#   release.yml  → 推 v* tag 时构建两个安装包并发布到 GitHub Release（本文件）
#
# 说明：本项目**不做代码签名**（见 CODE_SIGNING_POLICY.md），
# 所以 Release 正文会自动带上「未签名 + 被拦怎么处理 + SHA-256」那段说明。

name: Release (Windows)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（形如 v1.1.2）"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  COREPACK_ENABLE_AUTO_PIN: "0"
  COREPACK_ENABLE_STRICT: "0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    name: Build → Publish
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Add x86_64-pc-windows-msvc target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: src-tauri
          key: windows-x64-release

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: 版本号与 tag 一致性校验
        shell: pwsh
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          $tag = if ($env:TAG_INPUT) { $env:TAG_INPUT } else { "${{ github.ref_name }}" }
          if ($tag -notmatch '^v\d+\.\d+\.\d+') { throw "tag 不是 vX.Y.Z 形式：$tag" }
          $want = $tag.Substring(1)

          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $pkg  = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $toml = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          # Cargo.lock 是跨行结构，Select-String 按行匹配会漏，必须整块读再正则
          $lockRaw = Get-Content src-tauri/Cargo.lock -Raw
          $lock = [regex]::Match($lockRaw, 'name = "fontmanager"\r?\nversion = "([^"]+)"').Groups[1].Value

          Write-Host "tag=$tag"
          Write-Host "tauri.conf.json=$conf  package.json=$pkg  Cargo.toml=$toml  Cargo.lock=$lock"
          foreach ($pair in @(@('tauri.conf.json',$conf), @('package.json',$pkg), @('Cargo.toml',$toml), @('Cargo.lock',$lock))) {
            if ($pair[1] -ne $want) { throw "版本号不一致：$($pair[0]) 是 $($pair[1])，tag 要求 $want" }
          }
          if (-not (Select-String -Path CHANGELOG.md -Pattern "^##\s+\[$([regex]::Escape($want))\]" -Quiet)) {
            throw "CHANGELOG.md 缺少 [$want] 段落"
          }
          Write-Host "版本号六处一致，CHANGELOG 有对应段落 ✅"

      - name: Build — NSIS + MSI
        run: pnpm tauri build --bundles nsis,msi --target x86_64-pc-windows-msvc

      - name: 收集安装包
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          $exe = Get-ChildItem -Recurse -Path src-tauri/target -Filter "*-setup.exe" |
                 Where-Object { $_.FullName -match 'bundle[\\/]nsis' } | Select-Object -First 1
          $msi = Get-ChildItem -Recurse -Path src-tauri/target -Filter "*.msi" |
                 Where-Object { $_.FullName -match 'bundle[\\/]msi' } | Select-Object -First 1
          if (-not $exe) { throw "没找到 NSIS 安装包" }
          if (-not $msi) { throw "没找到 MSI 安装包" }
          Copy-Item $exe.FullName release/
          Copy-Item $msi.FullName release/
          Get-ChildItem release | Format-Table Name, Length

      - name: 留存产物（万一发布失败可手动下载）
        uses: actions/upload-artifact@v4
        with:
          name: zfm-windows
          path: release/*
          retention-days: 7

      - name: 生成 Release 正文
        shell: pwsh
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          $tag = if ($env:TAG_INPUT) { $env:TAG_INPUT } else { "${{ github.ref_name }}" }
          $ver = $tag.Substring(1)
          & .\.github\scripts\make-release-notes.ps1 -Version $ver -ReleaseDir release -OutFile release-notes.md
          Write-Host "---------- 正文预览 ----------"
          Get-Content release-notes.md -Encoding UTF8 | Select-Object -First 20

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: FontManager ${{ inputs.tag || github.ref_name }}
          body_path: release-notes.md
          files: release/*
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
