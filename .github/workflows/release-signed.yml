# 发版流水线：构建 → 签名 → 发布
#
# 触发：推送 v* tag（或手动指定 tag 重跑）
#
# 设计要点：
#   1. 只出 Windows 两个包（NSIS setup.exe + MSI），这是本项目唯一支持的平台；
#   2. 签名走 SignPath Foundation（开源项目免费）。**没配 secret 时自动跳过签名**，
#      仍然照常发布未签名包 —— 这样在申请通过之前流水线就能用，通过后加 secret 即生效；
#   3. 正文由 .github/scripts/make-release-notes.ps1 从 CHANGELOG.md 抽段生成，
#      并自动附上「签名状态 / 被拦怎么处理 / SHA-256」；
#   4. 版本号与 tag 必须一致，否则直接失败，避免发出「tag v1.1.3 但安装包是 1.1.2」的包。
#
# 需要的配置（申请通过后在仓库 Settings 里加）：
#   Secrets : SIGNPATH_API_TOKEN
#   Variables: SIGNPATH_ORGANIZATION_ID / SIGNPATH_PROJECT_SLUG /
#              SIGNPATH_SIGNING_POLICY_SLUG / SIGNPATH_ARTIFACT_CONFIGURATION_SLUG

name: Release (Windows, signed)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（形如 v1.1.2）"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  COREPACK_ENABLE_AUTO_PIN: "0"
  COREPACK_ENABLE_STRICT: "0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    name: Build → Sign → Publish
    runs-on: windows-2025
    env:
      # 用 env 中转，步骤里才能用 if: env.xxx != '' 判断（secrets 不能直接进 if）
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
      SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Add x86_64-pc-windows-msvc target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: src-tauri
          key: windows-x64-release

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: 版本号与 tag 一致性校验
        shell: pwsh
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          $tag = if ($env:TAG_INPUT) { $env:TAG_INPUT } else { "${{ github.ref_name }}" }
          if ($tag -notmatch '^v\d+\.\d+\.\d+') { throw "tag 不是 vX.Y.Z 形式：$tag" }
          $want = $tag.Substring(1)

          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $pkg  = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $toml = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          # Cargo.lock 是跨行结构，Select-String 按行匹配会漏，必须整块读再正则
          $lockRaw = Get-Content src-tauri/Cargo.lock -Raw
          $lock = [regex]::Match($lockRaw, 'name = "zfontmanager"\r?\nversion = "([^"]+)"').Groups[1].Value

          Write-Host "tag=$tag"
          Write-Host "tauri.conf.json=$conf  package.json=$pkg  Cargo.toml=$toml  Cargo.lock=$lock"
          foreach ($pair in @(@('tauri.conf.json',$conf), @('package.json',$pkg), @('Cargo.toml',$toml), @('Cargo.lock',$lock))) {
            if ($pair[1] -ne $want) { throw "版本号不一致：$($pair[0]) 是 $($pair[1])，tag 要求 $want" }
          }
          if (-not (Select-String -Path CHANGELOG.md -Pattern "^##\s+\[$([regex]::Escape($want))\]" -Quiet)) {
            throw "CHANGELOG.md 缺少 [$want] 段落"
          }
          Write-Host "版本号六处一致，CHANGELOG 有对应段落 ✅"

      - name: Build — NSIS + MSI
        run: pnpm tauri build --bundles nsis,msi --target x86_64-pc-windows-msvc

      - name: 收集安装包
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          $exe = Get-ChildItem -Recurse -Path src-tauri/target -Filter "*-setup.exe" |
                 Where-Object { $_.FullName -match 'bundle[\\/]nsis' } | Select-Object -First 1
          $msi = Get-ChildItem -Recurse -Path src-tauri/target -Filter "*.msi" |
                 Where-Object { $_.FullName -match 'bundle[\\/]msi' } | Select-Object -First 1
          if (-not $exe) { throw "没找到 NSIS 安装包" }
          if (-not $msi) { throw "没找到 MSI 安装包" }
          Copy-Item $exe.FullName release/
          Copy-Item $msi.FullName release/
          Get-ChildItem release | Format-Table Name, Length

      - name: 上传未签名产物（供 SignPath 取用）
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: zfm-windows-unsigned
          path: release/*
          retention-days: 7

      - name: SignPath 签名
        id: signpath
        if: env.SIGNPATH_API_TOKEN != ''
        uses: SignPath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ env.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ env.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          output-artifact-directory: signed
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: "1800"

      - name: 用签名产物替换
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path signed -Recurse -File |
                   Where-Object { $_.Extension -in '.exe', '.msi' }
          if (-not $files) { throw "SignPath 没有返回签名产物" }
          foreach ($f in $files) {
            Write-Host "签名产物：$($f.FullName)"
            Copy-Item $f.FullName (Join-Path release $f.Name) -Force
          }
          Get-ChildItem release | Format-Table Name, Length

      - name: 校验签名
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
                      Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          if (-not $signtool) { Write-Warning "找不到 signtool，跳过校验"; exit 0 }
          foreach ($f in Get-ChildItem release -File) {
            & $signtool.FullName verify /pa /all $f.FullName
            if ($LASTEXITCODE -ne 0) { throw "签名校验失败：$($f.Name)" }
            Write-Host "✅ $($f.Name) 签名有效"
          }

      - name: 生成 Release 正文
        shell: pwsh
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          $tag = if ($env:TAG_INPUT) { $env:TAG_INPUT } else { "${{ github.ref_name }}" }
          $ver = $tag.Substring(1)
          $signedFlag = if ($env:SIGNPATH_API_TOKEN) { "-Signed" } else { "" }
          $args = @("-Version", $ver, "-ReleaseDir", "release", "-OutFile", "release-notes.md")
          if ($signedFlag) { $args += "-Signed" }
          & .\.github\scripts\make-release-notes.ps1 @args
          Write-Host "---------- 正文预览 ----------"
          Get-Content release-notes.md -Encoding UTF8 | Select-Object -First 20

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ZFontManager ${{ inputs.tag || github.ref_name }}
          body_path: release-notes.md
          files: release/*
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
